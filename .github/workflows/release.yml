# Compila Aguará para Windows y macOS y publica la release en GitHub.
#
# Uso: subir la versión en src-tauri/tauri.conf.json, escribir las novedades en
# .github/release-notes.md y correr este workflow (Actions > Release > Run workflow) sobre
# main. Crea el tag v<versión> y la release con el instalador de Windows, el .dmg para Mac y
# el LEEME.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SCRCPY_VERSION: "5.0.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Binarios de terceros (scrcpy-server y FFmpeg)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION/scrcpy-server-v$env:SCRCPY_VERSION" -OutFile src-tauri/vendor/scrcpy-server.jar
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force src-tauri/vendor/ffmpeg | Out-Null
          $bin = Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe", "$($bin.FullName)/bin/ffplay.exe" src-tauri/vendor/ffmpeg/
      - name: Compilar
        run: npm run tauri build -- --features custom-protocol
      - name: Renombrar el instalador
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "out/Aguara_${version}_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: scrcpy-server
        run: |
          curl -fsSL -o src-tauri/vendor/scrcpy-server.jar \
            "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VERSION}/scrcpy-server-v${SCRCPY_VERSION}"
      # Universal: un solo .dmg para Mac con Intel y con Apple Silicon. Solo el .app: el .dmg se
      # arma abajo, después de firmar.
      - name: Compilar
        run: npm run tauri build -- --features custom-protocol --target universal-apple-darwin --bundles app
      # Sin certificado de Apple: firma "ad-hoc". Sin ninguna firma, macOS dice que la app está
      # dañada; así alcanza con abrirla la primera vez con clic derecho > Abrir.
      - name: Firmar (ad-hoc) y armar el .dmg
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/aguara"
          mkdir -p dmg-root out
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Aguará" -srcfolder dmg-root -ov -format UDZO "out/Aguara_${version}_macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Ya existe la release v${version}: subí la versión en tauri.conf.json." >&2
            exit 1
          fi
          cp LEEME-Aguara.txt out/
          ls -la out
          gh release create "v${version}" out/* \
            --target "${GITHUB_SHA}" \
            --title "Aguará ${version}" \
            --notes-file .github/release-notes.md
