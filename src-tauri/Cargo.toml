[package]
name = "panda-client"
version = "0.0.0"
description = "Cliente scrcpy-limpio de control de dispositivos Android"
edition = "2021"
rust-version = "1.77"

[features]
# Build de producción: sirve los assets embebidos vía el protocolo custom.
# Sin este feature, Tauri (is_dev) carga devUrl (localhost). NO QUITAR.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ffmpeg-sidecar = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
